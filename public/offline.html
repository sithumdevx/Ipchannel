<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · StreamPulse</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(60rem 60rem at 15% -10%, rgba(34, 211, 238, 0.16), transparent 60%),
          radial-gradient(50rem 50rem at 110% 110%, rgba(168, 85, 247, 0.16), transparent 60%),
          #020617;
        color: #e2e8f0;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        padding: 2.25rem 1.75rem;
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 24px 60px -20px rgba(2, 6, 23, 0.9);
        backdrop-filter: blur(14px);
      }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #22d3ee, #6366f1 55%, #a855f7);
        box-shadow: 0 12px 32px -8px rgba(99, 102, 241, 0.6);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.92rem;
        line-height: 1.6;
        color: #94a3b8;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.4rem;
        border-radius: 0.9rem;
        font-size: 0.9rem;
        font-weight: 700;
        color: #041016;
        text-decoration: none;
        background: linear-gradient(90deg, #22d3ee, #3b82f6);
        box-shadow: 0 12px 30px -12px rgba(34, 211, 238, 0.8);
      }
      a.button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#020617">
          <path d="M8 5.5v13l11-6.5-11-6.5z" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        StreamPulse needs a connection to fetch live channels. Check your network
        and try again — your app will resume right where you left off.
      </p>
      <a class="button" href="/">Retry</a>
    </main>
  </body>
</html>
